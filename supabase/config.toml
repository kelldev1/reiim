# Minimal Supabase project config. If your CLI complains, delete this file and
# run `supabase init` to regenerate a full one (keep the [functions.ai] block).
project_id = "reiim"

[functions.ai]
verify_jwt = true

[functions.videos]
verify_jwt = true

# Webhook Lemon Squeezy : appelé par Lemon Squeezy (pas de JWT Supabase).
# La sécurité vient de la signature HMAC vérifiée dans la fonction.
[functions.lemon-webhook]
verify_jwt = false

# Échange d'un lien d'invitation : la personne invitée n'a pas encore de session.
# La sécurité vient du code d'invitation (128 bits) validé par claim_invite().
[functions.redeem-invite]
verify_jwt = false
